name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is-newest: ${{ steps.newest.outputs.is-newest }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      # Pushing several tags at once must not let an older one overwrite the published game.
      - name: Is this the newest version tag
        id: newest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          echo "is-newest=$([ "$newest" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # The build never travels without a way back to its source.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp LICENSE dist/
          echo "Source code: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME" > dist/SOURCE.txt
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: game
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FOLDER: ${{ github.event.repository.name }}-${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: game
          path: ${{ env.FOLDER }}
      - run: zip -r "$FOLDER.zip" "$FOLDER"
      # A re-run finds its release already made, and only replaces the zip. Browsers refuse module
      # scripts and font loads from file://, so the notes say how to serve it.
      - env:
          IS_NEWEST: ${{ needs.check.outputs.is-newest }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FOLDER.zip" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$FOLDER.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest="$IS_NEWEST" \
            --notes "Source code: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME.
          To play offline, unzip and serve the folder, for example with \`python3 -m http.server\`
          inside it, then open http://localhost:8000. Opening index.html directly does not work."

  deploy:
    if: startsWith(github.ref, 'refs/tags/v') && needs.check.outputs.is-newest == 'true'
    needs: check
    runs-on: ubuntu-latest
    # Deploys queue instead of racing; only the newest tag deploys at all.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
